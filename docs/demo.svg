<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-label="lpkg: единый список пакетов, установленных в домашний каталог">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .dim { fill: #8b949e; }
      .text { fill: #c9d1d9; }
      .yellow { fill: #d29922; }
      .red { fill: #f85149; }
      .purple { fill: #bc8cff; }
      .green { fill: #3fb950; }
      .header { fill: #8b949e; font-weight: 600; }
    </style>
  </defs>

  <rect width="920" height="400" fill="#010409"/>
  <rect x="8" y="8" width="904" height="384" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M8 20a12 12 0 0 1 12-12h880a12 12 0 0 1 12 12v24H8z" fill="#161b22"/>
  <circle cx="30" cy="26" r="5.5" fill="#ff5f56"/>
  <circle cx="50" cy="26" r="5.5" fill="#ffbd2e"/>
  <circle cx="70" cy="26" r="5.5" fill="#27c93f"/>
  <text x="460" y="31" text-anchor="middle" class="mono dim" font-size="12">lpkg — управление пакетами в $HOME</text>

  <text x="28" y="82" class="mono" font-size="14"><tspan class="green">$</tspan><tspan class="text"> lpkg list --all</tspan></text>

  <text y="116" class="mono header" font-size="13">
    <tspan x="28">Менеджер</tspan>
    <tspan x="150">Пакет</tspan>
    <tspan x="310">Версия</tspan>
    <tspan x="410">Последняя</tspan>
    <tspan x="530">Установлен</tspan>
    <tspan x="680">Статус</tspan>
  </text>
  <line x1="28" y1="128" x2="892" y2="128" stroke="#30363d"/>

  <text y="156" class="mono" font-size="13">
    <tspan x="28" class="dim">uv tool</tspan>
    <tspan x="150" class="text">debugpy</tspan>
    <tspan x="310" class="text">1.8.21</tspan>
    <tspan x="410" class="dim">1.8.22</tspan>
    <tspan x="530" class="dim">2026-08-20</tspan>
    <tspan x="680" class="yellow">устарел</tspan>
  </text>

  <text y="180" class="mono" font-size="13">
    <tspan x="28" class="dim">cargo</tspan>
    <tspan x="150" class="text">b3sum</tspan>
    <tspan x="310" class="text">1.8.5</tspan>
    <tspan x="410" class="dim">1.8.7</tspan>
    <tspan x="530" class="dim">2026-08-29</tspan>
    <tspan x="680" class="yellow">устарел</tspan>
  </text>

  <text y="204" class="mono" font-size="13">
    <tspan x="28" class="dim">npm</tspan>
    <tspan x="150" class="text">nativefier</tspan>
    <tspan x="310" class="text">52.0.0</tspan>
    <tspan x="410" class="dim">—</tspan>
    <tspan x="530" class="dim">2026-08-17</tspan>
    <tspan x="680" class="red">ошибка</tspan>
  </text>

  <text y="228" class="mono" font-size="13">
    <tspan x="28" class="dim">вручную</tspan>
    <tspan x="150" class="text">gh</tspan>
    <tspan x="310" class="text">2.103.2</tspan>
    <tspan x="410" class="dim">—</tspan>
    <tspan x="530" class="dim">2026-10-25</tspan>
    <tspan x="680" class="purple">вручную</tspan>
  </text>

  <text y="266" class="mono dim" font-size="12">
    <tspan x="28">Пакетов менеджеров: 10 · установлено вручную: 32 · устарело: 6</tspan>
  </text>

  <text y="298" class="mono" font-size="13">
    <tspan x="28" class="green">$</tspan>
    <tspan x="43" class="text">lpkg update --all --dry-run</tspan>
  </text>
  <text y="322" class="mono" font-size="13">
    <tspan x="28" class="dim">Планируется обновить:</tspan>
  </text>
  <text y="344" class="mono" font-size="13">
    <tspan x="43" class="text">cargo:b3sum</tspan>
    <tspan x="200" class="yellow">1.8.5 → 1.8.7</tspan>
    <tspan x="330" class="text">uv:debugpy</tspan>
    <tspan x="450" class="yellow">1.8.21 → 1.8.22</tspan>
  </text>
</svg>
