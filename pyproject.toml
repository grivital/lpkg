[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lpkg"
version = "0.1.2"
description = "Единый менеджер для пакетов, установленных в домашний каталог (uv, cargo, npm, gem, pip --user, go, flatpak --user)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vitaly Grinin", email = "grivital@yandex.ru" }]
keywords = [
    "package-manager",
    "uv",
    "cargo",
    "npm",
    "gem",
    "pip",
    "golang",
    "flatpak",
    "home-directory",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
tui = []

[project.urls]
Homepage = "https://github.com/grivital/lpkg"
Repository = "https://github.com/grivital/lpkg"
Issues = "https://github.com/grivital/lpkg/issues"
Changelog = "https://github.com/grivital/lpkg/blob/main/CHANGELOG.md"

[project.scripts]
lpkg = "lpkg.cli:main"

[tool.setuptools.packages.find]
include = ["lpkg*"]

[tool.setuptools.package-data]
lpkg = ["py.typed"]
